name: mcstas_gisans
channels:
  - nodefaults
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.0
  - mcpl
  - matplotlib
  - h5py
  - scipy
  - scipp
  - scippneutron
  - pip
  - pip:
    # Default BornAgain version (21, 22 and 24 also work, see INSTALL.md; 21 needs numpy<2 above).
    # PyPI provides Linux wheels for BornAgain 23.0; on macOS (PyPI has wheels only for 21.x there) replace this line with a
    # locally built wheel, see INSTALL.md:
    - bornagain==23.0

    # Example for installing a specific local BornAgain wheel (e.g. BornAgain 23.0 built for macOS):
    # Replace '- bornagain==23.0' above with a line pointing to your local .whl file, for example:
    # - /path/to/wheels/bornagain-23.0-cp311-cp311-macosx_11_0_x86_64.whl  (self-contained, see INSTALL.md)

    # Install mcstas_gisans in editable/development mode (changes to source code take effect immediately):
    - -e .
