name: mcstas_gisans
channels:
  - nodefaults
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.0,<2.0
  - mcpl
  - matplotlib
  - h5py
  - scipy
  - scipp
  - scippneutron
  - pip
  - pip:
    # Default BornAgain version (PyPI release for all operating systems):
    - bornagain==21.2

    # Example for installing a specific local BornAgain wheel (e.g. BornAgain 24.1 built for macOS):
    # Replace '- bornagain==21.2' above with a line pointing to your local .whl file, for example:
    # - ./bornagain_versions/ba24/bornagain-24.1-cp311-cp311-macosx_11_0_x86_64.whl

    # Install mcstas_gisans in editable/development mode (changes to source code take effect immediately):
    - -e .
