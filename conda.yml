name: mcstas_gisans
channels:
  - nodefaults
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.0
  - mcpl
  - matplotlib
  - h5py
  - scipy
  - scipp
  - scippneutron
  - pip
  - pip:
    # Default (and minimum) BornAgain version. PyPI provides Linux wheels for BornAgain 23.0;
    # on macOS (PyPI has wheels only for the unsupported 21.x there) replace this line with a
    # locally built wheel, see INSTALL.md:
    - bornagain==23.0

    # Example for installing a specific local BornAgain wheel (e.g. BornAgain 23.0 built for macOS):
    # Replace '- bornagain==23.0' above with a line pointing to your local .whl file, for example:
    # - ./bornagain_versions/ba23/bornagain-23.0-cp311-cp311-macosx_11_0_x86_64.whl

    # Install mcstas_gisans in editable/development mode (changes to source code take effect immediately):
    - -e .
